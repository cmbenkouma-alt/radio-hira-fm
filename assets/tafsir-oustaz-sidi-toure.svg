    <text x="150" y="70" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19">Une lumière pour la vie</text>
    <text x="150" y="91" text-anchor="middle" fill="#d9e8e2" font-family="Amiri,serif" font-size="18">نور وهداية</text>
  </g>
  <g transform="translate(72 545)">
