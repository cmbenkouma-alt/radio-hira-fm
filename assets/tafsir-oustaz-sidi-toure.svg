<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TAFSIR DE OUSTAZ SIDI TOURE — Radio Hira FM</title>
  <desc id="desc">Affiche islamique Radio Hira FM avec Coran, chapelet et invitation à écouter le Tafsir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031f18"/><stop offset=".55" stop-color="#075b45"/><stop offset="1" stop-color="#012d24"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a8"/><stop offset=".35" stop-color="#f4c43b"/><stop offset="1" stop-color="#b87905"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".45"/></filter>
    <pattern id="geo" width="70" height="70" patternUnits="userSpaceOnUse"><path d="M35 4 47 23 66 35 47 47 35 66 23 47 4 35 23 23Z" fill="none" stroke="#d9a928" stroke-opacity=".12" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="700" rx="34" fill="url(#geo)"/>
  <path d="M34 90 Q600 10 1166 90 M34 610 Q600 690 1166 610" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".8"/>
  <circle cx="88" cy="82" r="48" fill="#06291f" stroke="url(#gold)" stroke-width="5"/>
  <path d="M73 105V78a15 15 0 0 1 30 0v27M68 105h40M79 68h18" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <path d="M89 51a16 16 0 1 0 13 23 18 18 0 1 1-13-23Z" fill="url(#gold)"/>
  <text x="160" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="3">RADIO HIRA FM</text>
  <text x="162" y="104" fill="#f4c43b" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">LA VOIX DE LA FOI</text>
  <text x="600" y="166" text-anchor="middle" fill="#f4c43b" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="6">ÉCOUTEZ LE</text>
  <text x="600" y="255" text-anchor="middle" fill="url(#gold)" stroke="#1b281f" stroke-width="10" paint-order="stroke" filter="url(#shadow)" font-family="Inter,Arial,sans-serif" font-size="100" font-weight="900" letter-spacing="4">TAFSIR</text>
  <text x="600" y="305" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="5">DE OUSTAZ SIDI TOURE</text>
  <path d="M230 332H970" stroke="url(#gold)" stroke-width="2"/><circle cx="600" cy="332" r="8" fill="#f4c43b"/>
