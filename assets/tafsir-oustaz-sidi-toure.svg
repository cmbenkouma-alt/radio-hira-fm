  <text x="1045" y="625" text-anchor="middle" fill="#f4c43b" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2">TAFSIR · RAPPELS · SAVOIR</text>
  <text x="1045" y="651" text-anchor="middle" fill="#fff" font-family="Amiri,serif" font-size="24">العلم · الهداية · الإيمان</text>
