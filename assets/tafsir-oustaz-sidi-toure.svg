  <circle cx="850" cy="414" r="62" fill="#8a5a3b"/>
  <path d="M792 401q58-74 116 0v25H792Z" fill="#552f2a"/>
  <path d="M755 540q95-85 190 0v70H755Z" fill="#d6c09e"/>
