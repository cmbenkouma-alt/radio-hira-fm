name: Fix Hero Poster
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'TRIGGER-HERO-FIX')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix full poster hero
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.hero-poster-bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;filter:saturate(1.04);transform:scale(1.01)}'
          new='.hero-poster-bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;filter:saturate(1.04);transform:scale(1.01)}\n    .hero-tafsir .hero-poster-bg{background-size:contain;background-position:center;background-repeat:no-repeat;filter:saturate(1.06) drop-shadow(0 18px 45px rgba(0,0,0,.28));transform:none}'
          if old not in s: raise SystemExit('hero base rule not found')
          s=s.replace(old,new,1)
          old2='.hero-tafsir::before{background:linear-gradient(90deg,rgba(1,17,13,.28),rgba(1,17,13,.05) 58%,rgba(1,17,13,.15))}'
          new2='.hero-tafsir::before{background:linear-gradient(90deg,rgba(1,17,13,.08),rgba(1,17,13,.02) 55%,rgba(1,17,13,.10))}'
          s=s.replace(old2,new2,1)
          old3='.hero-slide{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;opacity:0;visibility:hidden;transform:scale(1.025);transition:opacity .8s ease,transform 1.1s ease,visibility .8s ease;'
          new3='.hero-slide{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:center;opacity:0;visibility:hidden;transform:translateX(6%);transition:opacity .65s ease,transform .85s cubic-bezier(.22,.61,.36,1),visibility .65s ease;'
          s=s.replace(old3,new3,1)
          old4='.hero-slide.is-active{opacity:1;visibility:visible;transform:scale(1);pointer-events:auto}'
          new4='.hero-slide.is-active{opacity:1;visibility:visible;transform:translateX(0);pointer-events:auto}'
          s=s.replace(old4,new4,1)
          old5='@media(prefers-reduced-motion:reduce){.hero-slide{transition:none}.hero-poster-bg{transform:none}}'
          new5='@media(max-width:800px){.hero-tafsir .hero-poster-bg{background-size:contain;background-position:center top}.hero-tafsir .hero-slide-content{padding-bottom:72px}}\n    @media(max-width:480px){.hero-tafsir .hero-poster-bg{background-size:contain;background-position:center top}.hero-tafsir-copy{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.82))}}\n    @media(prefers-reduced-motion:reduce){.hero-slide{transition:none}.hero-poster-bg{transform:none}}'
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(hero): display full Tafsir poster on desktop and mobile'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/hero-fix.yml
          git add .github/workflows/hero-fix.yml
          git commit -m 'chore: remove temporary hero fix workflow'
          git push
